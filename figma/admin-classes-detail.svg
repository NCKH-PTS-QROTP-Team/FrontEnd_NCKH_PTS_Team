<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="#FFFFFF"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="1200" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="260" y="0" width="1180" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">CNTT01</text>
  
  <!-- Tabs -->
  <rect x="260" y="80" width="1180" height="60" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="100" width="120" height="40" rx="20" fill="url(#primaryGrad)"/>
  <text x="340" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Thông tin</text>
  <text x="440" y="125" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Sinh viên</text>
  
  <!-- Content -->
  <g transform="translate(276, 180)">
    <!-- Class Header Card -->
    <rect x="0" y="0" width="1160" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="570" y="40" width="80" height="80" rx="16" fill="url(#primaryGrad)"/>
    <text x="610" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CN</text>
    <text x="610" y="150" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">Công nghệ thông tin 01</text>
    <text x="610" y="180" font-family="Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">CNTT01</text>
    
    <!-- Details Card -->
    <rect x="0" y="220" width="1160" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Chi tiết lớp học</text>
    
    <text x="24" y="300" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Môn học</text>
    <text x="24" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#111827">Lập trình cơ bản</text>
    
    <text x="24" y="365" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Giảng viên</text>
    <text x="24" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#111827">TS. Nguyễn Văn A</text>
    
    <text x="24" y="430" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Học kỳ</text>
    <text x="24" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#111827">HK1-2025</text>
    
    <text x="24" y="495" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Số sinh viên</text>
    <text x="24" y="520" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#3FA9F5">45 sinh viên</text>
    
    <!-- Actions Card -->
    <rect x="0" y="540" width="1160" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="560" width="1112" height="48" rx="8" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="2"/>
    <text x="580" y="588" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#3FA9F5" text-anchor="middle">Thêm sinh viên</text>
    
    <rect x="24" y="620" width="1112" height="48" rx="8" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="2"/>
    <text x="580" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#3FA9F5" text-anchor="middle">Upload danh sách CSV</text>
    
    <rect x="24" y="680" width="1112" height="48" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
    <text x="580" y="708" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#EF4444" text-anchor="middle">Xóa lớp học</text>
  </g>
</svg>

