<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="#FFFFFF"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="1200" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="260" y="0" width="1180" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Quản lý lịch học</text>
  
  <!-- Content -->
  <g transform="translate(276, 100)">
    <!-- Create Button -->
    <rect x="0" y="0" width="1160" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="580" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Tạo lịch học mới</text>
    
    <!-- View Toggle -->
    <rect x="0" y="68" width="580" height="48" rx="12" fill="url(#primaryGrad)"/>
    <text x="290" y="96" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="middle">Tuần</text>
    
    <rect x="580" y="68" width="580" height="48" rx="12" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="1"/>
    <text x="870" y="96" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#3FA9F5" text-anchor="middle">Tháng</text>
    
    <!-- Date Header -->
    <rect x="0" y="136" width="1160" height="80" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="40" y="180" font-family="Arial, sans-serif" font-size="24" fill="#3FA9F5">‹</text>
    <text x="580" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Tuần 1, Tháng 1 2026</text>
    <text x="1120" y="180" font-family="Arial, sans-serif" font-size="24" fill="#3FA9F5" text-anchor="end">›</text>
    
    <!-- Count -->
    <text x="0" y="260" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">3 buổi học</text>
    
    <!-- Schedule Card 1 -->
    <rect x="0" y="280" width="1160" height="140" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="300" width="64" height="100" rx="12" fill="#E0F2FE"/>
    <text x="56" y="330" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3FA9F5" text-anchor="middle">08:00</text>
    <text x="56" y="350" font-family="Arial, sans-serif" font-size="12" fill="#3FA9F5" text-anchor="middle">10:00</text>
    <text x="104" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CS101</text>
    <rect x="200" y="310" width="100" height="24" rx="12" fill="#DBEAFE"/>
    <text x="250" y="327" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">Sắp diễn ra</text>
    <text x="104" y="350" font-family="Arial, sans-serif" font-size="14" fill="#111827">Lập trình cơ bản</text>
    <text x="104" y="375" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">📍 A102</text>
    <text x="300" y="375" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 TS. Nguyễn Văn A</text>
    <text x="1136" y="365" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
    
    <!-- Schedule Card 2 -->
    <rect x="0" y="440" width="1160" height="140" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="460" width="64" height="100" rx="12" fill="#E0F2FE"/>
    <text x="56" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3FA9F5" text-anchor="middle">10:15</text>
    <text x="56" y="510" font-family="Arial, sans-serif" font-size="12" fill="#3FA9F5" text-anchor="middle">12:15</text>
    <text x="104" y="480" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CS102</text>
    <rect x="200" y="470" width="100" height="24" rx="12" fill="#D1FAE5"/>
    <text x="250" y="487" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">Đang diễn ra</text>
    <text x="104" y="510" font-family="Arial, sans-serif" font-size="14" fill="#111827">Cấu trúc dữ liệu</text>
    <text x="104" y="535" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">📍 B205</text>
    <text x="300" y="535" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 TS. Trần Thị B</text>
    <text x="1136" y="525" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
    
    <!-- Bulk Actions -->
    <rect x="0" y="620" width="1160" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="660" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Thao tác hàng loạt</text>
    <rect x="24" y="680" width="1112" height="48" rx="8" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="2"/>
    <text x="580" y="708" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#3FA9F5" text-anchor="middle">Import lịch từ Excel</text>
    <rect x="24" y="740" width="1112" height="48" rx="8" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="2"/>
    <text x="580" y="768" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#3FA9F5" text-anchor="middle">Export lịch học</text>
  </g>
</svg>

