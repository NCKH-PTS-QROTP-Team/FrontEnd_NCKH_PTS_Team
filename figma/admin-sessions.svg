<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="#FFFFFF"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="1200" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="260" y="0" width="1180" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Giám sát điểm danh</text>
  
  <!-- Content -->
  <g transform="translate(276, 100)">
    <!-- Summary Cards -->
    <rect x="0" y="0" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="190" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#3FA9F5" text-anchor="middle">2</text>
    <text x="190" y="80" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Đang diễn ra</text>
    
    <rect x="400" y="0" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="590" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#10B981" text-anchor="middle">73</text>
    <text x="590" y="80" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Có mặt</text>
    
    <rect x="800" y="0" width="360" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="980" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#EF4444" text-anchor="middle">6</text>
    <text x="980" y="80" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Vắng mặt</text>
    
    <!-- Filters -->
    <rect x="0" y="120" width="100" height="36" rx="18" fill="url(#primaryGrad)"/>
    <text x="50" y="142" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Tất cả</text>
    
    <rect x="120" y="120" width="140" height="36" rx="18" fill="#F3F4F6"/>
    <text x="190" y="142" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151" text-anchor="middle">Đang diễn ra</text>
    
    <rect x="280" y="120" width="120" height="36" rx="18" fill="#F3F4F6"/>
    <text x="340" y="142" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151" text-anchor="middle">Đã kết thúc</text>
    
    <!-- Count -->
    <text x="0" y="200" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">2 buổi học</text>
    
    <!-- Session Card 1 -->
    <rect x="0" y="220" width="1160" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CNTT01</text>
    <rect x="120" y="235" width="100" height="24" rx="12" fill="#D1FAE5"/>
    <text x="170" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">Đang diễn ra</text>
    <rect x="240" y="235" width="60" height="24" rx="12" fill="#DBEAFE"/>
    <text x="270" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">QR</text>
    <text x="24" y="280" font-family="Arial, sans-serif" font-size="14" fill="#111827">Lập trình cơ bản</text>
    <text x="24" y="305" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 TS. Nguyễn Văn A</text>
    <text x="200" y="305" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">⏰ 08:00</text>
    
    <line x1="24" y1="330" x2="1136" y2="330" stroke="#E5E7EB" stroke-width="1"/>
    
    <text x="290" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#10B981" text-anchor="middle">38</text>
    <text x="290" y="390" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Có mặt</text>
    
    <line x1="580" y1="350" x2="580" y2="410" stroke="#E5E7EB" stroke-width="1"/>
    
    <text x="870" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#F59E0B" text-anchor="middle">5</text>
    <text x="870" y="390" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Muộn</text>
    
    <line x1="1160" y1="350" x2="1160" y2="410" stroke="#E5E7EB" stroke-width="1"/>
    
    <text x="1450" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#EF4444" text-anchor="middle">2</text>
    <text x="1450" y="390" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Vắng</text>
    
    <line x1="1740" y1="350" x2="1740" y2="410" stroke="#E5E7EB" stroke-width="1"/>
    
    <text x="2030" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">45</text>
    <text x="2030" y="390" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Tổng</text>
    
    <rect x="24" y="430" width="1112" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="24" y="430" width="985" height="8" rx="4" fill="#10B981"/>
    <text x="1100" y="470" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">84% điểm danh</text>
  </g>
</svg>

