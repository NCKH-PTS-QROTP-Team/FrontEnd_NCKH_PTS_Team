<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Lớp chủ nhiệm</text>
  
  <!-- Tabs -->
  <rect x="0" y="80" width="1440" height="60" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="20" y="100" width="120" height="40" rx="20" fill="url(#primaryGrad)"/>
  <text x="80" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tổng quan</text>
  <text x="180" y="125" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Danh sách SV</text>
  <text x="300" y="125" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Cảnh báo</text>
  
  <!-- Content -->
  <g transform="translate(120, 180)">
    <!-- Class Info Card -->
    <rect x="0" y="0" width="1200" height="100" rx="8" fill="url(#primaryGrad)" filter="url(#shadow)"/>
    <text x="24" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Lớp CNTT01</text>
    <text x="24" y="70" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.9">Công nghệ thông tin K15</text>
    
    <!-- Stats Grid -->
    <text x="0" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Thống kê lớp học</text>
    
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
      <text x="16" y="30" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Tổng sinh viên</text>
      <text x="16" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#3FA9F5">45</text>
      
      <rect x="300" y="0" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
      <text x="316" y="30" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Tỷ lệ điểm danh</text>
      <text x="316" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#10B981">84.4%</text>
      
      <rect x="600" y="0" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
      <text x="616" y="30" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Có mặt hôm nay</text>
      <text x="616" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#10B981">38</text>
      
      <rect x="900" y="0" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
      <text x="916" y="30" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Sinh viên cần quan tâm</text>
      <text x="916" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#EF4444">5</text>
    </g>
    
    <!-- At-Risk Preview -->
    <rect x="0" y="340" width="1200" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Sinh viên cần quan tâm</text>
    <text x="1100" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3FA9F5" text-anchor="end">Xem tất cả</text>
    
    <g transform="translate(24, 400)">
      <circle cx="20" cy="20" r="20" fill="#FEE2E2"/>
      <text x="20" y="28" font-family="Arial, sans-serif" font-size="20" fill="#EF4444" text-anchor="middle">⚠</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Nguyễn Văn An</text>
      <text x="60" y="45" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Vắng 5/15 buổi (33%)</text>
    </g>
    
    <!-- Subject Stats -->
    <rect x="0" y="580" width="1200" height="300" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="610" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Thống kê các môn học</text>
    
    <g transform="translate(24, 640)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Lập trình cơ bản</text>
      <text x="1000" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3FA9F5" text-anchor="end">92%</text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">41/45 sinh viên</text>
      <rect x="200" y="20" width="800" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="200" y="20" width="736" height="8" rx="4" fill="#10B981"/>
    </g>
  </g>
</svg>

