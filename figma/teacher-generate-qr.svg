<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="#F9FAFB"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="20" fill="#3FA9F5">←</text>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Tạo QR Code</text>
  
  <!-- Content -->
  <g transform="translate(420, 100)">
    <!-- Course Info -->
    <rect x="0" y="0" width="600" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="35" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Môn học</text>
    <text x="24" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">Lập trình cơ bản</text>
    <text x="24" y="85" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">CS101 • Phòng A102 • 08:00 - 10:00</text>
    
    <!-- QR Code Display -->
    <rect x="0" y="140" width="600" height="500" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Icon -->
    <rect x="276" y="180" width="48" height="48" rx="12" fill="#D1FAE5"/>
    <text x="300" y="210" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#10B981" text-anchor="middle">QR</text>
    
    <text x="300" y="260" font-family="Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">QR Code điểm danh</text>
    
    <!-- QR Code Placeholder -->
    <rect x="160" y="300" width="280" height="280" rx="16" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <rect x="180" y="320" width="240" height="240" rx="12" fill="#111827"/>
    <text x="300" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">QR CODE{'\n'}PLACEHOLDER</text>
    
    <text x="300" y="620" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Sinh viên quét mã này để điểm danh</text>
    
    <rect x="200" y="650" width="200" height="32" rx="12" fill="#D1FAE5"/>
    <text x="300" y="670" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#059669" text-anchor="middle">✓ QR Code đang hoạt động</text>
    
    <!-- Generate Button -->
    <rect x="0" y="660" width="600" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="300" y="688" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tạo mã mới</text>
    
    <!-- Instructions -->
    <rect x="0" y="730" width="600" height="100" rx="12" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="24" y="760" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#065F46">Hướng dẫn:</text>
    <text x="24" y="785" font-family="Arial, sans-serif" font-size="14" fill="#047857">• Hiển thị QR code trên màn hình/máy chiếu</text>
    <text x="24" y="810" font-family="Arial, sans-serif" font-size="14" fill="#047857">• Sinh viên quét mã bằng camera</text>
    <text x="24" y="835" font-family="Arial, sans-serif" font-size="14" fill="#047857">• QR code cập nhật mỗi phiên học</text>
  </g>
</svg>

