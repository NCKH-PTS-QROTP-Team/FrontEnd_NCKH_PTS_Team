<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="20" fill="#3FA9F5">←</text>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Điểm danh bằng OTP</text>
  
  <!-- Main Card -->
  <g transform="translate(470, 100)">
    <rect x="0" y="0" width="500" height="680" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Countdown Section -->
    <g transform="translate(24, 24)">
      <text x="226" y="40" font-family="Arial, sans-serif" font-size="48" text-anchor="middle">⏱️</text>
      <text x="226" y="100" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Thời gian còn lại</text>
      <text x="226" y="140" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#3FA9F5" text-anchor="middle">4:59</text>
    </g>
    
    <!-- Course Info -->
    <rect x="24" y="200" width="452" height="100" rx="12" fill="#E0F2FE"/>
    <text x="40" y="230" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Môn học</text>
    <text x="40" y="255" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Lập trình cơ bản</text>
    <text x="40" y="280" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">CS101 • Phòng A102</text>
    
    <!-- OTP Input -->
    <text x="250" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Nhập mã OTP từ giảng viên</text>
    
    <g transform="translate(100, 380)">
      <!-- 6 OTP boxes -->
      <rect x="0" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
      <text x="25" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
      
      <rect x="60" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
      <text x="85" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
      
      <rect x="120" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
      <text x="145" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
      
      <rect x="180" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      
      <rect x="240" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      
      <rect x="300" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
    </g>
    
    <!-- Submit Button -->
    <rect x="24" y="480" width="452" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="250" y="508" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Xác nhận</text>
    
    <!-- Help Text -->
    <rect x="24" y="560" width="452" height="100" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="40" y="590" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#92400E">Hướng dẫn:</text>
    <text x="40" y="615" font-family="Arial, sans-serif" font-size="14" fill="#78350F">Nhập mã OTP 6 số mà giảng viên hiển thị trên lớp để hoàn tất điểm danh.</text>
  </g>
</svg>

