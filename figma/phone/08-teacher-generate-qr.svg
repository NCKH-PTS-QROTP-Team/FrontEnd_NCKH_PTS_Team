    <rect x="171.5" y="452" width="8" height="8"/>
    <rect x="183.5" y="460" width="8" height="8"/>
    <rect x="195.5" y="468" width="8" height="8"/>
    <rect x="179.5" y="476" width="8" height="8"/>
    <rect x="191.5" y="484" width="8" height="8"/>
