  <text x="24" y="36" font-family="system-ui" font-size="14" font-weight="600" fill="#000000">9:41</text>
  <rect x="294" y="26" width="24" height="12" rx="2" fill="#000000" opacity="0.3"/>
  <rect x="322" y="26" width="16" height="12" rx="2" fill="#000000" opacity="0.3"/>
  <rect x="342" y="26" width="25" height="12" rx="4" fill="#000000" opacity="0.3"/>
  
  <!-- Header -->
  <rect x="0" y="54" width="375" height="64" fill="#FFFFFF"/>
  <circle cx="40" cy="86" r="16" fill="#F3F4F6"/>
  <text x="40" y="92" font-family="system-ui" font-size="16" fill="#6B7280" text-anchor="middle">←</text>
  <text x="72" y="94" font-family="system-ui" font-size="18" font-weight="700" fill="#111827">Điểm danh OTP</text>
  
  <defs>
    <filter id="shadow">
