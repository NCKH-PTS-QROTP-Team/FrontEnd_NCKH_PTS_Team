  <g transform="translate(95.5, 338)">
    <rect x="0" y="0" width="44" height="56" rx="12" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
    <text x="22" y="40" font-family="system-ui" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">2</text>
  </g>
  <g transform="translate(147.5, 338)">
    <rect x="0" y="0" width="44" height="56" rx="12" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
    <text x="22" y="40" font-family="system-ui" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">3</text>
