<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="375" height="812" fill="#F9FAFB"/>
  
  <!-- Status Bar -->
  <text x="24" y="36" font-family="system-ui" font-size="14" font-weight="600" fill="#000000">9:41</text>
  <rect x="294" y="26" width="24" height="12" rx="2" fill="#000000" opacity="0.3"/>
  <rect x="322" y="26" width="16" height="12" rx="2" fill="#000000" opacity="0.3"/>
  <rect x="342" y="26" width="25" height="12" rx="4" fill="#000000" opacity="0.3"/>
  
  <!-- Header -->
  <rect x="0" y="54" width="375" height="64" fill="#FFFFFF"/>
  <text x="24" y="94" font-family="system-ui" font-size="20" font-weight="700" fill="#111827">Dashboard</text>
  <rect x="319" y="78" width="32" height="32" rx="16" fill="#F3F4F6"/>
  <text x="335" y="99" font-family="system-ui" font-size="16" fill="#6B7280" text-anchor="middle">⋮</text>
  
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3FA9F5" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>
  
  <!-- Welcome Card -->
  <rect x="20" y="138" width="335" height="100" rx="16" fill="#3FA9F5" filter="url(#shadow)"/>
  <text x="36" y="170" font-family="system-ui" font-size="22" font-weight="700" fill="#FFFFFF">Chào mừng Giảng viên!</text>
  <text x="36" y="194" font-family="system-ui" font-size="15" fill="#DBEAFE">Quản lý điểm danh lớp học của bạn</text>
  
  <!-- Quick Actions Title -->
  <text x="20" y="270" font-family="system-ui" font-size="18" font-weight="700" fill="#111827">Tạo phiên điểm danh</text>
  
  <!-- OTP Card -->
  <rect x="20" y="286" width="165" height="140" rx="16" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2" filter="url(#shadow2)"/>
  
  <rect x="36" y="302" width="56" height="56" rx="12" fill="#DBEAFE"/>
  <text x="64" y="340" font-family="system-ui" font-size="20" font-weight="700" fill="#3FA9F5" text-anchor="middle">123</text>
  
  <text x="36" y="380" font-family="system-ui" font-size="16" font-weight="700" fill="#111827">Tạo mã OTP</text>
  <text x="36" y="402" font-family="system-ui" font-size="13" fill="#6B7280">Sinh mã số cho</text>
  <text x="36" y="418" font-family="system-ui" font-size="13" fill="#6B7280">sinh viên điểm danh</text>
  
  <!-- QR Card -->
  <rect x="190" y="286" width="165" height="140" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="2" filter="url(#shadow2)"/>
  
  <rect x="206" y="302" width="56" height="56" rx="12" fill="#D1FAE5"/>
  <text x="234" y="340" font-family="system-ui" font-size="18" font-weight="700" fill="#10B981" text-anchor="middle">QR</text>
  
  <text x="206" y="380" font-family="system-ui" font-size="16" font-weight="700" fill="#111827">Tạo mã QR</text>
  <text x="206" y="402" font-family="system-ui" font-size="13" fill="#6B7280">Sinh QR code</text>
  <text x="206" y="418" font-family="system-ui" font-size="13" fill="#6B7280">để quét</text>
  
  <!-- Stats Title -->
  <text x="20" y="462" font-family="system-ui" font-size="18" font-weight="700" fill="#111827">Thống kê hôm nay</text>
  
  <!-- Stats Row 1 -->
  <rect x="20" y="478" width="165" height="88" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
  <text x="36" y="504" font-family="system-ui" font-size="13" fill="#6B7280">Tổng lớp học</text>
  <text x="36" y="536" font-family="system-ui" font-size="32" font-weight="700" fill="#3FA9F5">8</text>
  <text x="36" y="556" font-family="system-ui" font-size="11" fill="#10B981">+2 so với hôm qua</text>
  
  <rect x="190" y="478" width="165" height="88" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
  <text x="206" y="504" font-family="system-ui" font-size="13" fill="#6B7280">Buổi học hôm nay</text>
  <text x="206" y="536" font-family="system-ui" font-size="32" font-weight="700" fill="#10B981">5</text>
  <text x="206" y="556" font-family="system-ui" font-size="11" fill="#3FA9F5">2 đã hoàn thành</text>
  
  <!-- Stats Row 2 -->
  <rect x="20" y="574" width="165" height="88" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
  <text x="36" y="600" font-family="system-ui" font-size="13" fill="#6B7280">Sinh viên có mặt</text>
  <text x="36" y="632" font-family="system-ui" font-size="32" font-weight="700" fill="#F59E0B">87%</text>
  <text x="36" y="652" font-family="system-ui" font-size="11" fill="#6B7280">156/180 sinh viên</text>
  
  <rect x="190" y="574" width="165" height="88" rx="12" fill="#FFFFFF" filter="url(#shadow2)"/>
  <text x="206" y="600" font-family="system-ui" font-size="13" fill="#6B7280">Phiên điểm danh</text>
  <text x="206" y="632" font-family="system-ui" font-size="32" font-weight="700" fill="#EF4444">12</text>
  <text x="206" y="652" font-family="system-ui" font-size="11" fill="#6B7280">Tổng tuần này</text>
  
  <!-- Bottom Navigation -->
  <rect x="0" y="748" width="375" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="748" x2="375" y2="748" stroke="#E5E7EB" stroke-width="1"/>
  
  <g transform="translate(37.5, 760)">
    <rect x="12" y="8" width="40" height="40" rx="12" fill="#3FA9F5" opacity="0.1"/>
    <text x="32" y="34" font-family="system-ui" font-size="20" fill="#3FA9F5" text-anchor="middle">🏠</text>
  </g>
  
  <g transform="translate(131.25, 760)">
    <text x="32" y="34" font-family="system-ui" font-size="20" fill="#9CA3AF" text-anchor="middle">📋</text>
  </g>
  
  <g transform="translate(225, 760)">
    <text x="32" y="34" font-family="system-ui" font-size="20" fill="#9CA3AF" text-anchor="middle">🎓</text>
  </g>
  
  <g transform="translate(318.75, 760)">
    <text x="32" y="34" font-family="system-ui" font-size="20" fill="#9CA3AF" text-anchor="middle">📊</text>
  </g>
  
  <!-- Home Indicator -->
  <rect x="121" y="788" width="134" height="5" rx="2.5" fill="#000000" opacity="0.3"/>
</svg>
