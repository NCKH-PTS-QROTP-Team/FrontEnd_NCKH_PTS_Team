<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="#F9FAFB"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="20" fill="#3FA9F5">←</text>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Điểm danh bằng QR Code</text>
  
  <!-- Content -->
  <g transform="translate(470, 100)">
    <!-- Course Info -->
    <rect x="0" y="0" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="20" y="20" width="460" height="80" rx="12" fill="#D1FAE5"/>
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Môn học</text>
    <text x="40" y="75" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Lập trình cơ bản</text>
    <text x="40" y="95" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">CS101 • Phòng A102 • 08:00 - 10:00</text>
    
    <!-- Scanner Card -->
    <rect x="0" y="140" width="500" height="500" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Scanner Area -->
    <rect x="50" y="180" width="400" height="400" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="3" stroke-dasharray="10,5"/>
    
    <!-- Scanner Icon -->
    <rect x="210" y="280" width="80" height="80" rx="16" fill="#F3F4F6"/>
    <text x="250" y="330" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6B7280" text-anchor="middle">QR</text>
    <text x="250" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Sẵn sàng quét</text>
    <text x="250" y="410" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Nhấn nút bên dưới để bắt đầu</text>
    
    <!-- Scan Button -->
    <rect x="24" y="660" width="452" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="250" y="688" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Bắt đầu quét</text>
    
    <!-- Help Text -->
    <rect x="0" y="730" width="500" height="100" rx="12" fill="#E0F2FE" stroke="#BFDBFE" stroke-width="1"/>
    <text x="24" y="760" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1E40AF">Hướng dẫn:</text>
    <text x="24" y="785" font-family="Arial, sans-serif" font-size="14" fill="#1E3A8A">Nhấn "Bắt đầu quét" và hướng camera vào QR code mà giảng viên hiển thị để hoàn tất điểm danh.</text>
  </g>
</svg>

