<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="#FFFFFF"/>
  
  <!-- Sidebar -->
  <g>
    <rect x="0" y="0" width="260" height="1200" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="52" cy="52" r="28" fill="#3FA9F5" stroke="#FFFFFF" stroke-width="3"/>
    <text x="52" y="62" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="24" y="104" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Admin Hệ thống</text>
    <text x="24" y="124" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">Admin</text>
    
    <!-- Menu (simplified) -->
    <rect x="8" y="140" width="236" height="48" rx="8" fill="#E0F2FE"/>
    <rect x="8" y="140" width="3" height="48" fill="#3FA9F5"/>
    <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3FA9F5">Người dùng</text>
  </g>
  
  <!-- Main Content -->
  <g transform="translate(260, 0)">
    <!-- Header -->
    <rect x="0" y="0" width="1180" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Quản lý người dùng</text>
    
    <!-- Content -->
    <g transform="translate(16, 100)">
      <!-- Action Buttons -->
      <rect x="0" y="0" width="570" height="48" rx="8" fill="url(#primaryGrad)"/>
      <text x="285" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Thêm người dùng</text>
      
      <rect x="590" y="0" width="570" height="48" rx="8" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="2"/>
      <text x="875" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#3FA9F5" text-anchor="middle">↑ Upload CSV</text>
      
      <!-- Search -->
      <rect x="0" y="68" width="1160" height="48" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="20" y="98" font-family="Arial, sans-serif" font-size="16" fill="#9CA3AF">Tìm kiếm theo tên, email...</text>
      
      <!-- Role Filters -->
      <g transform="translate(0, 136)">
        <rect x="0" y="0" width="100" height="36" rx="18" fill="url(#primaryGrad)"/>
        <text x="50" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Tất cả</text>
        
        <rect x="120" y="0" width="100" height="36" rx="18" fill="#F3F4F6"/>
        <text x="170" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151" text-anchor="middle">Admin</text>
        
        <rect x="240" y="0" width="120" height="36" rx="18" fill="#F3F4F6"/>
        <text x="300" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151" text-anchor="middle">Giảng viên</text>
        
        <rect x="380" y="0" width="100" height="36" rx="18" fill="#F3F4F6"/>
        <text x="430" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151" text-anchor="middle">Sinh viên</text>
      </g>
      
      <!-- User Count -->
      <text x="0" y="220" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">5 người dùng</text>
      
      <!-- User Cards -->
      <g transform="translate(0, 240)">
        <!-- User 1 -->
        <rect x="0" y="0" width="1160" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
        <circle cx="56" cy="40" r="24" fill="#E0F2FE"/>
        <text x="56" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3FA9F5" text-anchor="middle">A</text>
        <text x="96" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Admin Hệ thống</text>
        <rect x="200" y="20" width="60" height="24" rx="12" fill="#FEE2E2"/>
        <text x="230" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">Admin</text>
        <text x="96" y="60" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">admin@edu.vn</text>
        <text x="1120" y="50" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
        
        <!-- User 2 -->
        <rect x="0" y="100" width="1160" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
        <circle cx="56" cy="140" r="24" fill="#E0F2FE"/>
        <text x="56" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3FA9F5" text-anchor="middle">T</text>
        <text x="96" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">TS. Nguyễn Văn A</text>
        <rect x="200" y="120" width="80" height="24" rx="12" fill="#DBEAFE"/>
        <text x="240" y="137" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">Giảng viên</text>
        <text x="96" y="160" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">nva@teacher.edu.vn</text>
        <text x="96" y="180" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">GV001</text>
        <text x="1120" y="150" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
        
        <!-- User 3 -->
        <rect x="0" y="200" width="1160" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
        <circle cx="56" cy="240" r="24" fill="#D1FAE5"/>
        <text x="56" y="250" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10B981" text-anchor="middle">N</text>
        <text x="96" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Nguyễn Văn An</text>
        <rect x="200" y="220" width="80" height="24" rx="12" fill="#D1FAE5"/>
        <text x="240" y="237" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">Sinh viên</text>
        <text x="96" y="260" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">nva@student.edu.vn</text>
        <text x="96" y="280" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">SV001</text>
        <text x="1120" y="250" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
      </g>
    </g>
  </g>
</svg>

