<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="#FFFFFF"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="1200" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="260" y="0" width="1180" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Quản lý lớp học</text>
  
  <!-- Content -->
  <g transform="translate(276, 100)">
    <!-- Create Button -->
    <rect x="0" y="0" width="1160" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="580" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Tạo lớp học mới</text>
    
    <!-- Search -->
    <rect x="0" y="68" width="1160" height="48" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="98" font-family="Arial, sans-serif" font-size="16" fill="#9CA3AF">Tìm kiếm lớp học...</text>
    
    <!-- Count -->
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">3 lớp học</text>
    
    <!-- Class Card 1 -->
    <rect x="0" y="170" width="1160" height="140" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="190" width="56" height="56" rx="12" fill="#E0F2FE"/>
    <text x="52" y="225" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3FA9F5" text-anchor="middle">CN</text>
    <text x="96" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CNTT01</text>
    <text x="96" y="235" font-family="Arial, sans-serif" font-size="14" fill="#111827">Công nghệ thông tin 01</text>
    <text x="96" y="260" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">📚 Lập trình cơ bản</text>
    <text x="300" y="260" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 TS. Nguyễn Văn A</text>
    <text x="600" y="260" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">📅 HK1-2025</text>
    <text x="1100" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3FA9F5" text-anchor="end">👥 45</text>
    <text x="1136" y="225" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
    
    <!-- Class Card 2 -->
    <rect x="0" y="330" width="1160" height="140" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="350" width="56" height="56" rx="12" fill="#E0F2FE"/>
    <text x="52" y="385" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3FA9F5" text-anchor="middle">CN</text>
    <text x="96" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CNTT02</text>
    <text x="96" y="395" font-family="Arial, sans-serif" font-size="14" fill="#111827">Công nghệ thông tin 02</text>
    <text x="96" y="420" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">📚 Cơ sở dữ liệu</text>
    <text x="300" y="420" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 ThS. Trần Thị B</text>
    <text x="600" y="420" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">📅 HK1-2025</text>
    <text x="1100" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3FA9F5" text-anchor="end">👥 42</text>
    <text x="1136" y="385" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
    
    <!-- Class Card 3 -->
    <rect x="0" y="490" width="1160" height="140" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="510" width="56" height="56" rx="12" fill="#E0F2FE"/>
    <text x="52" y="545" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3FA9F5" text-anchor="middle">KT</text>
    <text x="96" y="530" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">KTPM01</text>
    <text x="96" y="555" font-family="Arial, sans-serif" font-size="14" fill="#111827">Kỹ thuật phần mềm 01</text>
    <text x="96" y="580" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">📚 Mạng máy tính</text>
    <text x="300" y="580" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 TS. Lê Văn C</text>
    <text x="600" y="580" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">📅 HK1-2025</text>
    <text x="1100" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3FA9F5" text-anchor="end">👥 38</text>
    <text x="1136" y="545" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
  </g>
</svg>

