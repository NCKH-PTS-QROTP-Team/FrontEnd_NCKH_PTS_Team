<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="#FFFFFF"/>
  
  <!-- Main Container (centered, max-width 400) -->
  <g transform="translate(520, 100)">
    
    <!-- Logo Section -->
    <g transform="translate(0, 0)">
      <!-- Logo Circle -->
      <circle cx="200" cy="40" r="40" fill="url(#primaryGradient)"/>
      <text x="200" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
      
      <!-- Title -->
      <text x="200" y="120" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#111827" text-anchor="middle" letter-spacing="-0.5">Điểm Danh</text>
      
      <!-- Subtitle -->
      <text x="200" y="150" font-family="Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">Đăng nhập để tiếp tục</text>
    </g>
    
    <!-- Login Card -->
    <g transform="translate(0, 200)">
      <!-- Card Background -->
      <rect x="0" y="0" width="400" height="380" rx="8" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1"/>
      <rect x="0" y="0" width="400" height="380" rx="8" fill="none" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
      
      <!-- Username Field -->
      <text x="24" y="40" font-family="Arial, sans-serif" font-size="14" fill="#374151">Tên đăng nhập</text>
      <rect x="24" y="50" width="352" height="48" rx="8" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
      <text x="32" y="78" font-family="Arial, sans-serif" font-size="16" fill="#9CA3AF">admin, GV001, SV001</text>
      
      <!-- Password Field -->
      <text x="24" y="130" font-family="Arial, sans-serif" font-size="14" fill="#374151">Mật khẩu</text>
      <rect x="24" y="140" width="352" height="48" rx="8" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
      <text x="32" y="168" font-family="Arial, sans-serif" font-size="16" fill="#9CA3AF">••••••••</text>
      
      <!-- Login Button -->
      <rect x="24" y="220" width="352" height="48" rx="8" fill="url(#primaryGradient)"/>
      <text x="200" y="248" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Đăng nhập</text>
    </g>
    
    <!-- Demo Accounts Section -->
    <g transform="translate(0, 600)">
      <!-- Divider with text -->
      <line x1="0" y1="0" x2="150" y2="0" stroke="#E5E7EB" stroke-width="1"/>
      <text x="200" y="5" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Tài khoản demo</text>
      <line x1="250" y1="0" x2="400" y2="0" stroke="#E5E7EB" stroke-width="1"/>
      
      <!-- Demo Accounts Card -->
      <rect x="0" y="20" width="400" height="120" rx="8" fill="#F9FAFB" stroke="#F3F4F6" stroke-width="1"/>
      
      <text x="16" y="50" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">
        <tspan font-weight="600">Admin:</tspan>
        <tspan> admin / admin123</tspan>
      </text>
      
      <text x="16" y="80" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">
        <tspan font-weight="600">Giảng viên:</tspan>
        <tspan> GV001 / teacher123</tspan>
      </text>
      
      <text x="16" y="110" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">
        <tspan font-weight="600">Sinh viên:</tspan>
        <tspan> SV001 / student123</tspan>
      </text>
    </g>
    
  </g>
</svg>

