    <rect x="0" y="0" width="260" height="1200" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    
    <!-- User Info -->
    <g transform="translate(24, 24)">
      <circle cx="28" cy="28" r="28" fill="#3FA9F5" stroke="#FFFFFF" stroke-width="3"/>
      <text x="28" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Admin Hệ thống</text>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">Admin</text>
    </g>
    
    <!-- Menu Items -->
    <g transform="translate(12, 140)">
      <rect x="8" y="0" width="236" height="48" rx="8" fill="#E0F2FE"/>
      <rect x="8" y="0" width="3" height="48" fill="#3FA9F5"/>
      <rect x="20" y="8" width="32" height="32" rx="8" fill="#3FA9F5"/>
      <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3FA9F5">Dashboard</text>
      
      <rect x="8" y="52" width="236" height="48" rx="8" fill="transparent"/>
      <rect x="20" y="60" width="32" height="32" rx="8" fill="#F3F4F6"/>
      <text x="60" y="82" font-family="Arial, sans-serif" font-size="14" fill="#111827">Người dùng</text>
      
      <rect x="8" y="104" width="236" height="48" rx="8" fill="transparent"/>
      <rect x="20" y="112" width="32" height="32" rx="8" fill="#F3F4F6"/>
      <text x="60" y="134" font-family="Arial, sans-serif" font-size="14" fill="#111827">Lớp học</text>
      
      <rect x="8" y="156" width="236" height="48" rx="8" fill="transparent"/>
      <rect x="20" y="164" width="32" height="32" rx="8" fill="#F3F4F6"/>
      <text x="60" y="186" font-family="Arial, sans-serif" font-size="14" fill="#111827">Môn học</text>
      
      <rect x="8" y="208" width="236" height="48" rx="8" fill="transparent"/>
      <rect x="20" y="216" width="32" height="32" rx="8" fill="#F3F4F6"/>
      <text x="60" y="238" font-family="Arial, sans-serif" font-size="14" fill="#111827">Lịch học</text>
      
