        <rect x="402" y="136" width="40" height="40" rx="12" fill="#E0F2FE"/>
        <text x="422" y="162" font-family="Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle">M</text>
        <text x="454" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Giám sát điểm danh</text>
        <text x="454" y="180" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Theo dõi real-time</text>
        
