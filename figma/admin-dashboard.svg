        <rect x="788" y="136" width="40" height="40" rx="12" fill="#E0F2FE"/>
        <text x="808" y="162" font-family="Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle">R</text>
        <text x="840" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Báo cáo</text>
        <text x="840" y="180" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Thống kê và export</text>
        
