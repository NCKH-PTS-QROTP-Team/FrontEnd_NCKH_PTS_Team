      <line x1="24" y1="1000" x2="1124" y2="1000" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="24" y1="1060" x2="1124" y2="1060" stroke="#E5E7EB" stroke-width="1"/>
      
      <text x="24" y="980" font-family="Arial, sans-serif" font-size="14" fill="#111827">Thêm mới 15 sinh viên vào lớp CNTT01</text>
      <text x="24" y="1000" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">5 phút trước</text>
      
      <text x="24" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#111827">Tạo lịch học tuần 2 HK1-2026</text>
      <text x="24" y="1060" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">1 giờ trước</text>
      
      <text x="24" y="1100" font-family="Arial, sans-serif" font-size="14" fill="#111827">Cập nhật thông tin giảng viên GV001</text>
      <text x="24" y="1120" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">2 giờ trước</text>
