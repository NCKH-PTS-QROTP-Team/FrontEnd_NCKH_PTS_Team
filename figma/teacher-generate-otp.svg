<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="#F9FAFB"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="20" fill="#3FA9F5">←</text>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Tạo mã OTP</text>
  
  <!-- Content -->
  <g transform="translate(420, 100)">
    <!-- Course Info Card -->
    <rect x="0" y="0" width="600" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="35" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">Môn học</text>
    <text x="24" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">Lập trình cơ bản</text>
    <text x="24" y="85" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">CS101 • Phòng A102 • 08:00 - 10:00</text>
    
    <!-- OTP Display Card -->
    <rect x="0" y="140" width="600" height="400" rx="16" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Icon -->
    <rect x="268" y="180" width="64" height="64" rx="16" fill="#DBEAFE"/>
    <text x="300" y="220" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#3FA9F5" text-anchor="middle">#</text>
    
    <text x="300" y="280" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Mã OTP cho sinh viên</text>
    
    <!-- OTP Code -->
    <rect x="150" y="300" width="300" height="80" rx="16" fill="url(#primaryGrad)"/>
    <text x="300" y="350" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">123456</text>
    
    <!-- Countdown -->
    <line x1="24" y1="420" x2="576" y2="420" stroke="#F3F4F6" stroke-width="1"/>
    <text x="300" y="460" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Thời gian còn lại</text>
    <text x="300" y="500" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#3FA9F5" text-anchor="middle">4:59</text>
    
    <!-- Generate Button -->
    <rect x="0" y="560" width="600" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="300" y="588" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tạo mã mới</text>
    
    <!-- Instructions -->
    <rect x="0" y="630" width="600" height="120" rx="12" fill="#E0F2FE" stroke="#BFDBFE" stroke-width="1"/>
    <text x="24" y="660" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1E40AF">Hướng dẫn:</text>
    <text x="24" y="685" font-family="Arial, sans-serif" font-size="14" fill="#1E3A8A">• Hiển thị mã OTP trên màn hình cho sinh viên</text>
    <text x="24" y="710" font-family="Arial, sans-serif" font-size="14" fill="#1E3A8A">• Mã có hiệu lực trong 5 phút</text>
    <text x="24" y="735" font-family="Arial, sans-serif" font-size="14" fill="#1E3A8A">• Sinh viên nhập mã để hoàn tất điểm danh</text>
  </g>
</svg>

