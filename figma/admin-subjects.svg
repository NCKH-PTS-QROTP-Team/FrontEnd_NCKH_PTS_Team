<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="#FFFFFF"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="1200" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="260" y="0" width="1180" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Quản lý môn học</text>
  
  <!-- Content -->
  <g transform="translate(276, 100)">
    <!-- Create Button -->
    <rect x="0" y="0" width="1160" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="580" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Tạo môn học mới</text>
    
    <!-- Search -->
    <rect x="0" y="68" width="1160" height="48" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="98" font-family="Arial, sans-serif" font-size="16" fill="#9CA3AF">Tìm kiếm môn học...</text>
    
    <!-- Count -->
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">4 môn học</text>
    
    <!-- Subject Card 1 -->
    <rect x="0" y="170" width="1160" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="190" width="56" height="56" rx="12" fill="#D1FAE5"/>
    <text x="52" y="225" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle">3</text>
    <text x="96" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CS101</text>
    <rect x="200" y="205" width="80" height="24" rx="12" fill="#D1FAE5"/>
    <text x="240" y="222" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">3 tín chỉ</text>
    <text x="96" y="235" font-family="Arial, sans-serif" font-size="14" fill="#111827">Lập trình cơ bản</text>
    <text x="96" y="260" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 TS. Nguyễn Văn A</text>
    <text x="1136" y="225" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
    
    <!-- Subject Card 2 -->
    <rect x="0" y="310" width="1160" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="330" width="56" height="56" rx="12" fill="#D1FAE5"/>
    <text x="52" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle">4</text>
    <text x="96" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CS102</text>
    <rect x="200" y="345" width="80" height="24" rx="12" fill="#D1FAE5"/>
    <text x="240" y="362" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">4 tín chỉ</text>
    <text x="96" y="375" font-family="Arial, sans-serif" font-size="14" fill="#111827">Cơ sở dữ liệu</text>
    <text x="96" y="400" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 ThS. Trần Thị B</text>
    <text x="1136" y="365" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
    
    <!-- Subject Card 3 -->
    <rect x="0" y="450" width="1160" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="470" width="56" height="56" rx="12" fill="#D1FAE5"/>
    <text x="52" y="505" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle">3</text>
    <text x="96" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CS103</text>
    <rect x="200" y="485" width="80" height="24" rx="12" fill="#D1FAE5"/>
    <text x="240" y="502" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">3 tín chỉ</text>
    <text x="96" y="515" font-family="Arial, sans-serif" font-size="14" fill="#111827">Mạng máy tính</text>
    <text x="96" y="540" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">👨‍🏫 TS. Lê Văn C</text>
    <text x="1136" y="505" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
    
    <!-- Subject Card 4 -->
    <rect x="0" y="590" width="1160" height="120" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <rect x="24" y="610" width="56" height="56" rx="12" fill="#D1FAE5"/>
    <text x="52" y="645" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle">3</text>
    <text x="96" y="630" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">CS104</text>
    <rect x="200" y="625" width="80" height="24" rx="12" fill="#D1FAE5"/>
    <text x="240" y="642" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">3 tín chỉ</text>
    <text x="96" y="655" font-family="Arial, sans-serif" font-size="14" fill="#111827">Trí tuệ nhân tạo</text>
    <rect x="96" y="680" width="120" height="24" rx="12" fill="#FEF3C7"/>
    <text x="156" y="697" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">Chưa phân công GV</text>
    <text x="1136" y="645" font-family="Arial, sans-serif" font-size="24" fill="#D1D5DB">›</text>
  </g>
</svg>

