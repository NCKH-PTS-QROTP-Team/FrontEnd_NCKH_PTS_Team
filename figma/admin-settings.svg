<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1400" fill="#FFFFFF"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="1400" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="260" y="0" width="1180" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Cài đặt hệ thống</text>
  
  <!-- Content -->
  <g transform="translate(320, 100)">
    <!-- OTP Settings -->
    <rect x="0" y="0" width="800" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Cài đặt OTP</text>
    <text x="24" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Thời gian hiệu lực OTP (giây)</text>
    <rect x="24" y="100" width="752" height="48" rx="8" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
    <text x="32" y="128" font-family="Arial, sans-serif" font-size="16" fill="#111827">120</text>
    <text x="24" y="170" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Khuyến nghị: 60-180 giây</text>
    
    <!-- QR Settings -->
    <rect x="0" y="220" width="800" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Cài đặt QR Code</text>
    <text x="24" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Thời gian làm mới QR (giây)</text>
    <rect x="24" y="320" width="752" height="48" rx="8" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
    <text x="32" y="348" font-family="Arial, sans-serif" font-size="16" fill="#111827">30</text>
    <text x="24" y="390" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">QR Code sẽ tự động làm mới sau khoảng thời gian này</text>
    
    <!-- Attendance Rules -->
    <rect x="0" y="440" width="800" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="480" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Quy tắc điểm danh</text>
    <text x="24" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Cho phép điểm danh muộn</text>
    <text x="24" y="555" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Sinh viên có thể điểm danh sau giờ bắt đầu</text>
    <rect x="720" y="520" width="48" height="28" rx="14" fill="#3FA9F5"/>
    <circle cx="744" cy="534" r="12" fill="#FFFFFF"/>
    
    <text x="24" y="600" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#374151">Ngưỡng muộn (phút)</text>
    <rect x="24" y="610" width="752" height="48" rx="8" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
    <text x="32" y="638" font-family="Arial, sans-serif" font-size="16" fill="#111827">15</text>
    <text x="24" y="680" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Điểm danh sau X phút sẽ được tính là "Muộn"</text>
    
    <!-- Security -->
    <rect x="0" y="740" width="800" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="780" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Bảo mật</text>
    <text x="24" y="830" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Bật xác thực GPS</text>
    <text x="24" y="855" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Yêu cầu sinh viên ở trong phạm vi lớp học</text>
    <rect x="720" y="820" width="48" height="28" rx="14" fill="#D1D5DB"/>
    <circle cx="736" cy="834" r="12" fill="#FFFFFF"/>
    
    <!-- Notifications -->
    <rect x="0" y="960" width="800" height="240" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="1000" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Thông báo</text>
    <text x="24" y="1050" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Email thông báo cho giảng viên</text>
    <rect x="720" y="1040" width="48" height="28" rx="14" fill="#3FA9F5"/>
    <circle cx="744" cy="1054" r="12" fill="#FFFFFF"/>
    <line x1="24" y1="1090" x2="776" y2="1090" stroke="#E5E7EB" stroke-width="1"/>
    <text x="24" y="1120" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Email thông báo cho sinh viên</text>
    <rect x="720" y="1110" width="48" height="28" rx="14" fill="#3FA9F5"/>
    <circle cx="744" cy="1124" r="12" fill="#FFFFFF"/>
    <line x1="24" y1="1160" x2="776" y2="1160" stroke="#E5E7EB" stroke-width="1"/>
    <text x="24" y="1190" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111827">Cảnh báo vắng quá nhiều</text>
    <rect x="720" y="1180" width="48" height="28" rx="14" fill="#3FA9F5"/>
    <circle cx="744" cy="1194" r="12" fill="#FFFFFF"/>
    
    <!-- Save Button -->
    <rect x="0" y="1230" width="800" height="48" rx="8" fill="url(#primaryGrad)"/>
    <text x="400" y="1258" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lưu cài đặt</text>
    
    <!-- Reset Button -->
    <rect x="0" y="1300" width="800" height="48" rx="8" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="2"/>
    <text x="400" y="1328" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#3FA9F5" text-anchor="middle">Khôi phục mặc định</text>
  </g>
</svg>

