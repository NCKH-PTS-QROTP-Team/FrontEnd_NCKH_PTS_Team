<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1200" fill="#F9FAFB"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="20" y="50" font-family="Arial, sans-serif" font-size="20" fill="#3FA9F5">←</text>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">Báo cáo &amp; Thống kê</text>
  
  <!-- Content -->
  <g transform="translate(270, 100)">
    <!-- Summary Card -->
    <rect x="0" y="0" width="900" height="180" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">Tổng quan học kỳ</text>
    
    <text x="112" y="100" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2563EB" text-anchor="middle">156</text>
    <text x="112" y="130" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Tổng buổi</text>
    
    <line x1="225" y1="80" x2="225" y2="160" stroke="#E5E7EB" stroke-width="1"/>
    
    <text x="337" y="100" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#059669" text-anchor="middle">128</text>
    <text x="337" y="130" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Có mặt</text>
    
    <line x1="450" y1="80" x2="450" y2="160" stroke="#E5E7EB" stroke-width="1"/>
    
    <text x="562" y="100" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#D97706" text-anchor="middle">18</text>
    <text x="562" y="130" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Đi muộn</text>
    
    <line x1="675" y1="80" x2="675" y2="160" stroke="#E5E7EB" stroke-width="1"/>
    
    <text x="787" y="100" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#DC2626" text-anchor="middle">10</text>
    <text x="787" y="130" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Vắng</text>
    
    <!-- Chart Placeholder -->
    <rect x="0" y="200" width="900" height="350" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Biểu đồ chuyên cần</text>
    <rect x="24" y="260" width="852" height="250" rx="12" fill="#F9FAFB"/>
    <rect x="420" y="360" width="64" height="64" rx="16" fill="#E5E7EB"/>
    <text x="452" y="400" font-family="Arial, sans-serif" font-size="32" fill="#6B7280" text-anchor="middle">☰</text>
    <text x="452" y="440" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Biểu đồ thống kê sẽ hiển thị ở đây</text>
    
    <!-- Export Options -->
    <rect x="0" y="570" width="900" height="200" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="24" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Xuất báo cáo</text>
    
    <!-- Excel Export -->
    <rect x="24" y="640" width="852" height="64" rx="12" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="2"/>
    <rect x="40" y="656" width="40" height="32" rx="8" fill="#D1FAE5"/>
    <text x="60" y="677" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#059669" text-anchor="middle">=</text>
    <text x="96" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Xuất file Excel</text>
    <text x="96" y="690" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">Danh sách điểm danh chi tiết</text>
    <text x="860" y="672" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#059669" text-anchor="end">Tải về</text>
    
    <!-- PDF Export -->
    <rect x="24" y="720" width="852" height="64" rx="12" fill="#FEE2E2" stroke="#FECACA" stroke-width="2"/>
    <rect x="40" y="736" width="40" height="32" rx="8" fill="#FEE2E2"/>
    <text x="60" y="757" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DC2626" text-anchor="middle">P</text>
    <text x="96" y="750" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Xuất file PDF</text>
    <text x="96" y="770" font-family="Arial, sans-serif" font-size="14" fill="#4B5563">Báo cáo tổng hợp</text>
    <text x="860" y="752" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#DC2626" text-anchor="end">Tải về</text>
  </g>
</svg>

