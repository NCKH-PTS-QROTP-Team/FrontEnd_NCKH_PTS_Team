<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FA9F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B8FD9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="#FFFFFF"/>
  
  <!-- Content (centered) -->
  <g transform="translate(520, 100)">
    <!-- Header -->
    <g transform="translate(0, 0)">
      <rect x="160" y="0" width="80" height="80" rx="24" fill="#DBEAFE"/>
      <text x="200" y="55" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#3FA9F5" text-anchor="middle">#</text>
      <text x="200" y="120" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#111827" text-anchor="middle">Xác thực OTP</text>
      <text x="200" y="150" font-family="Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">Mã OTP đã được gửi đến điện thoại của bạn</text>
    </g>
    
    <!-- OTP Card -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="400" height="400" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
      
      <text x="200" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">Nhập mã OTP</text>
      
      <!-- OTP Input Boxes -->
      <g transform="translate(75, 80)">
        <rect x="0" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
        <text x="25" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
        
        <rect x="60" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
        <text x="85" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
        
        <rect x="120" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#3FA9F5" stroke-width="2"/>
        <text x="145" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
        
        <rect x="180" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
        
        <rect x="240" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
        
        <rect x="300" y="0" width="50" height="56" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      </g>
      
      <!-- Countdown -->
      <text x="200" y="200" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Mã có hiệu lực trong</text>
      <text x="200" y="230" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#3FA9F5" text-anchor="middle">1:59</text>
      
      <!-- Submit Button -->
      <rect x="24" y="280" width="352" height="48" rx="8" fill="url(#primaryGrad)"/>
      <text x="200" y="308" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Xác nhận</text>
    </g>
    
    <!-- Resend -->
    <g transform="translate(0, 620)">
      <text x="200" y="0" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Không nhận được mã?</text>
      <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#3FA9F5" text-anchor="middle">Gửi lại mã</text>
    </g>
  </g>
</svg>

